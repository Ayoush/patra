[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patra"
version = "0.1.0"
description = "Indian address normaliser — state aliases, pincode validation, clean formatting"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
patra = "patra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
